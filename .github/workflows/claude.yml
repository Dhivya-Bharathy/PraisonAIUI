name: Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned, labeled, opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    uses: MervinPraison/github-automation-template/.github/workflows/claude-assistant-callable.yml@v1.1.3
    secrets: inherit
    with:
      hub_ref: v1.1.3
